name: deploy
# Manual deploy: D1 migrations, the read-only API Worker, and the static site on Cloudflare Pages.
# Guards refuse to deploy while the placeholders (database id, API_BASE) are still in place.
on:
  workflow_dispatch:

concurrency:
  group: squad-stat-deploy
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Test before deploying
        run: npm test
      - name: Refuse placeholders
        run: |
          if grep -q '00000000-0000-0000-0000-000000000000' wrangler.toml; then echo "wrangler.toml still has the placeholder database_id"; exit 2; fi
          if grep -Eq 'API_BASE = null' web/config.js; then echo "web/config.js still has API_BASE = null"; exit 2; fi
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 d1 migrations apply squad-stat-db --remote
      - name: Deploy API Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy
      - name: Deploy site to Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 pages deploy web --project-name squad-stat --branch main
