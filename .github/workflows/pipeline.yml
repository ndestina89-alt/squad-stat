name: pipeline
# Scheduled data pipeline: ingest fixtures/results/standings, then fit the model and store predictions.
# Nothing runs on the schedule until the repository variable PIPELINE_ENABLED is set to "true"
# (Settings > Secrets and variables > Actions > Variables). Do that only after a successful manual run.
on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours at minute 17; avoids the busy top of the hour
  workflow_dispatch:
    inputs:
      competitions:
        description: "Optional comma-separated codes, e.g. PL,PD (default: all enabled)"
        default: ""

# One pipeline at a time; the DB-level job_locks are a second line of defence, not the first.
concurrency:
  group: squad-stat-db
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  ingest:
    if: github.event_name == 'workflow_dispatch' || vars.PIPELINE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Validate input
        env: { COMPS: "${{ inputs.competitions }}" }
        run: '[[ "$COMPS" =~ ^[A-Za-z0-9,]*$ ]] || { echo "invalid competitions"; exit 2; }'
      - name: Ingest football-data.org (current season)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_TOKEN }}
          COMPS: ${{ inputs.competitions }}
        run: node pipeline/bin/ingest.js fd ${COMPS:+--competitions "$COMPS"}

  model:
    # Runs even if ingest failed: refitting on existing data is harmless (idempotent) and still predicts new fixtures.
    needs: ingest
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || vars.PIPELINE_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Fit and predict
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          COMPS: ${{ inputs.competitions }}
        run: node pipeline/bin/model.js ${COMPS:+--competitions "$COMPS"}
